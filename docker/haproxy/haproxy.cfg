global
    log stdout format raw local0

defaults
    log global
    timeout connect 1s
    timeout client 30s
    timeout server 30s
    timeout tunnel 1h
    retries 2
    option redispatch 1

resolvers docker
    nameserver dns 127.0.0.11:53
    timeout resolve 1s
    timeout retry 1s
    hold valid 1s
    hold obsolete 1s

frontend public
    mode http
    bind :3000
    option httplog
    http-request set-header X-Forwarded-For %[src]
    use_backend sockets if { path_beg /socket.io/ }
    default_backend gateways

backend gateways
    mode http
    balance roundrobin
    retry-on conn-failure
    option httpchk GET /api/v1/health/live
    http-check expect status 200
    server-template gateway 3 api-gateway:3000 check inter 1s fall 1 rise 1 resolvers docker resolve-prefer ipv4 init-addr none

backend sockets
    mode http
    balance roundrobin
    retry-on conn-failure
    option httpchk GET /health/live
    http-check expect status 200
    server-template socket 3 notifications-service:3004 check inter 1s fall 1 rise 1 resolvers docker resolve-prefer ipv4 init-addr none

listen notifications-rpc
    mode tcp
    bind :3005
    balance roundrobin
    server-template worker 3 notifications-service:3005 check inter 1s fall 1 rise 1 resolvers docker resolve-prefer ipv4 init-addr none

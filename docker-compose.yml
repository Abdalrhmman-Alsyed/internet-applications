name: ecommerce

x-backend-env: &backend-env
  NODE_ENV: production
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-secret}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret}
  JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
  JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-app}:${RABBITMQ_PASSWORD:-app_password}@rabbitmq:5672
  USERS_HOST: users-service
  PRODUCTS_HOST: products-service
  ORDERS_HOST: orders-service
  NOTIFICATIONS_HOST: notifications-service

services:
  # ───────────── Infrastructure ─────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-app}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-app_password}
    ports:
      - "5672:5672"
      - "15672:15672" # Management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  minio:
    # MinIO no longer publishes public images on Docker Hub/Quay; this is the
    # same MinIO release packaged by Bitnami (S3-compatible object storage).
    image: bitnamilegacy/minio:2025.4.22
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_password}
    volumes:
      - minio_data:/bitnami/minio/data
    ports:
      - "9000:9000"
      - "9001:9001" # Console
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ───────────── Backend services ─────────────
  api-gateway:
    build:
      context: ./backend
      args:
        APP: api-gateway
    environment:
      <<: *backend-env
      PORT: 3000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001}
      # Read-only queue stats for the dashboard's System page
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672
      RABBITMQ_USER: ${RABBITMQ_USER:-app}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-app_password}
    ports:
      - "3000:3000"
    depends_on:
      - users-service
      - products-service
      - orders-service
      - notifications-service
    restart: unless-stopped

  users-service:
    build:
      context: ./backend
      args:
        APP: users-service
    environment:
      <<: *backend-env
      USERS_DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app_password}@postgres:5432/users_db
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@shop.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped

  products-service:
    build:
      context: ./backend
      args:
        APP: products-service
    environment:
      <<: *backend-env
      PRODUCTS_DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app_password}@postgres:5432/products_db
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio_password}
      MINIO_BUCKET: products
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      LOW_STOCK_THRESHOLD: 5
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      minio: { condition: service_healthy }
    restart: unless-stopped

  orders-service:
    build:
      context: ./backend
      args:
        APP: orders-service
    environment:
      <<: *backend-env
      ORDERS_DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app_password}@postgres:5432/orders_db
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped

  notifications-service:
    build:
      context: ./backend
      args:
        APP: notifications-service
    environment:
      <<: *backend-env
      NOTIFICATIONS_DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app_password}@postgres:5432/notifications_db
      WS_PORT: 3004
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001}
    ports:
      - "3004:3004" # WebSocket (Socket.io)
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped

  # ───────────── Frontend ─────────────
  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
        NEXT_PUBLIC_WS_URL: ${PUBLIC_WS_URL:-http://localhost:3004}
    environment:
      API_INTERNAL_URL: http://api-gateway:3000
    ports:
      - "3001:3001"
    depends_on:
      - api-gateway
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:

name: ecommerce

x-backend-env: &backend-env
  NODE_ENV: production
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-secret}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret}
  JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
  JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-app}:${RABBITMQ_PASSWORD:-app_password}@rabbitmq:5672
  USERS_HOST: users-service
  PRODUCTS_HOST: products-service
  ORDERS_HOST: orders-service
  NOTIFICATIONS_HOST: load-balancer
  REDIS_URL: redis://redis:6379
  # Requirement 3 demo: "before" turns the optimisations off (npm run perf:mode -- before|after)
  PERF_MODE: ${PERF_MODE:-after}
  # Read-your-writes: after a write, that user's reads use the primary for this long.
  # Must be longer than the replica can lag (normally milliseconds).
  FRESH_WINDOW_SECONDS: ${FRESH_WINDOW_SECONDS:-5}
  INVENTORY_GRPC_URL: inventory-service:50051
  INVENTORY_DEADLINE_MS: ${INVENTORY_DEADLINE_MS:-2000}

services:
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ Infrastructure â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
      POSTGRES_DB: postgres
    # Primary: every write goes here. Its pg_hba lets the read replica stream from it.
    command: ["postgres", "-c", "hba_file=/etc/postgresql/pg_hba.conf", "-c", "wal_level=replica", "-c", "max_wal_senders=10"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./docker/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    # Fixed node name + volume: durable queues and persistent messages survive a restart
    # or re-creation of the container (requirement 4: no message is lost).
    hostname: rabbitmq
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-app}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-app_password}
    ports:
      - "5672:5672"
      - "15672:15672" # Management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Read replica (hot standby): a live copy of the primary, used for reads only.
  # Demo of replica lag: REPLICA_DELAY_MS=3000 docker compose up -d postgres-replica
  postgres-replica:
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "/replica-entrypoint.sh"]
    environment:
      PRIMARY_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
      REPLICA_DELAY_MS: ${REPLICA_DELAY_MS:-0}
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      - ./docker/postgres/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    ports:
      - "5440:5432" # read-only, e.g. pgAdmin "localhost:5440"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      postgres: { condition: service_healthy }

  # Requirement 4: local test mailbox (SMTP :1025, inbox UI http://localhost:8025).
  # Used unless SMTP_HOST in .env points at an external provider (Mailtrap, Gmail…).
  mailpit:
    image: axllent/mailpit:v1.30
    ports:
      - "8025:8025" # inbox (web UI + API)
      - "1025:1025" # SMTP
    environment:
      MP_DATABASE: /data/mailpit.db # keep the inbox across restarts
      MP_IGNORE_DUPLICATE_IDS: "true"
    volumes:
      - mailpit_data:/data
    restart: unless-stopped

  # Shared cache and coordination. Keep rate limits and email receipts across restarts.
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # MinIO no longer publishes public images on Docker Hub/Quay; this is the
    # same MinIO release packaged by Bitnami (S3-compatible object storage).
    image: bitnamilegacy/minio:2025.4.22
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_password}
    volumes:
      - minio_data:/bitnami/minio/data
    ports:
      - "9000:9000"
      - "9001:9001" # Console
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ Backend services â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  api-gateway:
    scale: 3
    build:
      context: ./backend
      additional_contexts:
        proto: ./proto
      args:
        APP: api-gateway
    environment:
      <<: *backend-env
      PORT: 3000
      TRUST_PROXY: "1"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001}
      # Per IP per minute. A load test sends everything from one IP, so it raises this
      # (npm run perf:test does it for you, then puts it back).
      RATE_LIMIT: ${RATE_LIMIT:-300}
      # Read-only queue stats for the dashboard's System page
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672
      RABBITMQ_USER: ${RABBITMQ_USER:-app}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-app_password}
    depends_on:
      users-service: { condition: service_started }
      products-service: { condition: service_started }
      orders-service: { condition: service_started }
      notifications-service: { condition: service_started }
      inventory-service: { condition: service_started }
      load-balancer: { condition: service_started }
      redis: { condition: service_healthy }
    restart: unless-stopped

  load-balancer:
    image: haproxy:3.0-alpine
    volumes:
      - ./docker/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "3000:3000"
    restart: unless-stopped

  users-service:
    build:
      context: ./backend
      additional_contexts:
        proto: ./proto
      args:
        APP: users-service
    environment:
      <<: *backend-env
      USERS_DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app_password}@postgres:5432/users_db
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@shop.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped

  # Go + gRPC, its own database (inventory_db). Owns product stock.
  inventory-service:
    build:
      context: ./inventory-service
      additional_contexts:
        proto: ./proto
    environment:
      INVENTORY_DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app_password}@postgres:5432/inventory_db
      GRPC_PORT: 50051
      # Demo of a slow inventory: INVENTORY_LATENCY_MS=3000 docker compose up -d inventory-service
      SIMULATE_LATENCY_MS: ${INVENTORY_LATENCY_MS:-0}
    ports:
      - "50051:50051" # gRPC (for grpcurl / demos)
    healthcheck:
      test: ["CMD", "/inventory-service", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  products-service:
    build:
      context: ./backend
      additional_contexts:
        proto: ./proto
      args:
        APP: products-service
    environment:
      <<: *backend-env
      PRODUCTS_DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app_password}@postgres:5432/products_db
      PRODUCTS_REPLICA_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app_password}@postgres-replica:5432/products_db
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio_password}
      MINIO_BUCKET: products
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      LOW_STOCK_THRESHOLD: 5
    depends_on:
      postgres: { condition: service_healthy }
      postgres-replica: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      minio: { condition: service_healthy }
    restart: unless-stopped

  orders-service:
    build:
      context: ./backend
      additional_contexts:
        proto: ./proto
      args:
        APP: orders-service
    environment:
      <<: *backend-env
      ORDERS_DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app_password}@postgres:5432/orders_db
      ORDERS_REPLICA_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app_password}@postgres-replica:5432/orders_db
      LOW_STOCK_THRESHOLD: 5
    depends_on:
      postgres: { condition: service_healthy }
      postgres-replica: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped

  # Requirement 4: background worker that sends the order confirmation email.
  # SMTP settings come from .env (never from code); default is the local Mailpit inbox.
  email-worker:
    scale: 3
    build:
      context: ./backend
      additional_contexts:
        proto: ./proto
      args:
        APP: email-worker
    environment:
      <<: *backend-env
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      MAIL_FROM: ${MAIL_FROM:-E-Commerce Shop <orders@shop.local>}
      EMAIL_MAX_ATTEMPTS: ${EMAIL_MAX_ATTEMPTS:-4}
      EMAIL_RETRY_DELAYS_MS: ${EMAIL_RETRY_DELAYS_MS:-5000,30000,120000}
      # Demo of the dead-letter queue: SIMULATE_EMAIL_FAILURE=always (every send fails)
      SIMULATE_EMAIL_FAILURE: ${SIMULATE_EMAIL_FAILURE:-never}
    depends_on:
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
      mailpit: { condition: service_started }
    restart: unless-stopped

  notifications-service:
    scale: 3
    build:
      context: ./backend
      additional_contexts:
        proto: ./proto
      args:
        APP: notifications-service
    environment:
      <<: *backend-env
      NOTIFICATIONS_DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app_password}@postgres:5432/notifications_db
      WS_PORT: 3004
      SOCKET_REDIS_ADAPTER: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ Frontend â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
        NEXT_PUBLIC_WS_URL: ${PUBLIC_WS_URL:-${PUBLIC_API_URL:-http://localhost:3000}}
    environment:
      API_INTERNAL_URL: http://load-balancer:3000
    ports:
      - "3001:3001"
    depends_on:
      - api-gateway
      - load-balancer
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:
  mailpit_data:
  postgres_replica_data:
  minio_data:
  redis_data:
